name: Privacy pages
run-name: Publish site/ to GitHub Pages

# S0033: site/ is generated by tools/site/build-site.ps1 from docs/PRIVACY_POLICY*.md and committed; this workflow
# publishes it. S0051: it refuses to, unless the pages equal their sources and the documentation gates pass, so a page goes out
# only after its address is true. The permissions table needs release manifests and is checked in the release build.
# S0046 (2026-11-13): the check runs on Windows, where the generator and the gates are measured, and the deploy on Linux -
# the shape of the canon's Pages template (store-publish, Google Play reference, section 2).
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'tools/site/**'
      - 'docs/PRIVACY_POLICY*.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: windows-latest
    steps:
      # site/*.html has no eol rule in .gitattributes and the check compares bytes; the Windows runner's default
      # core.autocrlf=true would turn the committed LF into CRLF on checkout.
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - name: Check the site and the documents
        shell: pwsh
        run: |
          pwsh -NoProfile -File tools/site/build-site.ps1 -Check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File tools/docs/assert-docs.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
