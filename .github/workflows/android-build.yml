name: Android packages
run-name: StreamsPlayer ${{ inputs.build_type }} ${{ inputs.flavor }} ${{ inputs.module }} [${{ inputs.request_id }}]

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: Package type
        type: choice
        options: [release, debug]
        default: debug
      flavor:
        description: Phone and Wear distribution variant
        type: choice
        options: [store, noLegal]
        default: store
      module:
        description: Packages to build
        type: choice
        options: [all, phone, wear, watchface]
        default: all
      request_id:
        description: Launcher correlation ID (optional for manual runs)
        type: string
        default: manual

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TZ: Europe/Malta
    steps:
      - name: Checkout StreamsPlayer
        uses: actions/checkout@v7
        with:
          path: streamsplayer
      - name: Checkout port source for release drift check
        if: inputs.build_type == 'release'
        uses: actions/checkout@v7
        with:
          repository: SerZhyAle/FastMediaSorter_mob_v2
          path: port-source
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install compile SDK
        working-directory: streamsplayer
        shell: pwsh
        run: |
          $catalog = Get-Content gradle/libs.versions.toml -Raw
          $sdk = [regex]::Match($catalog, '(?m)^compile-sdk\s*=\s*"(\d+)"').Groups[1].Value
          if (-not $sdk) { throw 'compile-sdk is missing from the version catalog.' }
          # API 37 and later publish the base platform under an explicit minor suffix
          # (platforms;android-37.0), while older APIs keep the unsuffixed package name.
          # AGP resolves compileSdk = 37 to that base platform, as on the owner's machine.
          sdkmanager "platforms;android-$sdk"
          if ($LASTEXITCODE -ne 0) {
              sdkmanager "platforms;android-${sdk}.0"
              if ($LASTEXITCODE -ne 0) { throw 'Android SDK installation failed.' }
          }
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - name: Build and verify packages
        working-directory: streamsplayer
        shell: pwsh
        env:
          SP_BUILD_TYPE: ${{ inputs.build_type }}
          SP_FLAVOR: ${{ inputs.flavor }}
          SP_MODULE: ${{ inputs.module }}
          STREAMSPLAYER_FMS_ROOT: ${{ github.workspace }}/port-source
          SP_KEYSTORE_BASE64: ${{ inputs.build_type == 'release' && secrets.STREAMSPLAYER_KEYSTORE_BASE64 || '' }}
          SP_STORE_PASSWORD: ${{ inputs.build_type == 'release' && secrets.STREAMSPLAYER_STORE_PASSWORD || '' }}
          SP_KEY_ALIAS: ${{ inputs.build_type == 'release' && secrets.STREAMSPLAYER_KEY_ALIAS || '' }}
          SP_KEY_PASSWORD: ${{ inputs.build_type == 'release' && secrets.STREAMSPLAYER_KEY_PASSWORD || '' }}
        run: |
          chmod +x gradlew
          ./tools/ci/build-packages.ps1 -BuildType $env:SP_BUILD_TYPE -Flavor $env:SP_FLAVOR -Module $env:SP_MODULE
      - name: Upload verified packages
        uses: actions/upload-artifact@v7
        with:
          name: streamsplayer-${{ inputs.build_type }}-${{ inputs.flavor }}-${{ github.run_id }}
          path: streamsplayer/temp/ci/packages/
          if-no-files-found: error
          retention-days: 30
      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-evidence-${{ github.run_id }}
          path: |
            streamsplayer/temp/ci/*.json
            streamsplayer/**/build/reports/
            streamsplayer/**/build/test-results/
          retention-days: 14
