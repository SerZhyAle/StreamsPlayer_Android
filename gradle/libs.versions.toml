# Version catalog. Toolchain pins follow FastMediaSorter's current values (read 2026-10-02, S0002); the
# two products do not share a build, so a pin moves here on its own ticket, never by reference.
[versions]
androidx-hilt-navigation-compose = "1.1.0"
accompanist-permissions = "0.34.0"
androidx-concurrent-futures-ktx = "1.2.0"
agp = "9.2.1"
kotlin = "2.2.10"
ksp = "2.3.8"
hilt = "2.59"

# Platform levels. minSdk of the phone is the handoff reference (tactical decision); targetSdk is what
# Play requires at the first release and is re-checked by S0010. The watch face floor was Watch Face
# Format version 1 (Wear OS 4, API 33); S0008 raised it to WFF v4 (Wear OS 6, API 36) per owner decision 4.4.
compile-sdk = "37"
target-sdk = "36"
min-sdk-phone = "26"
min-sdk-wear = "28"
min-sdk-watchface = "36"

androidx-core-ktx = "1.13.0"
androidx-appcompat = "1.7.1"
google-material = "1.14.0"
androidx-activity-ktx = "1.10.1"
androidx-fragment-ktx = "1.6.2"
androidx-recyclerview = "1.3.2"
androidx-constraintlayout = "2.1.4"
androidx-lifecycle = "2.8.7"
androidx-media3 = "1.11.0"
androidx-activity-compose = "1.10.1"
compose-bom = "2024.12.01"
androidx-wear-compose = "1.4.1"
androidx-room = "2.7.0"
androidx-test-core = "1.6.1"
androidx-test-ext-junit = "1.1.5"
kotlinx-coroutines = "1.7.3"
okhttp = "4.12.0"
